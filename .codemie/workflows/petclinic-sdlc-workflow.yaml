states:
  - id: gap_analysis
    assistant_id: gap_analysis_assistant
    next:
      state_id: requirements
    task: Analyze the Pet Clinic repository or requested change context from {{user_input}}. Identify gaps, enhancement opportunities, affected modules, and implementation risks.
    output_schema: "{enhancements}"
    interrupt_before: false
    finish_iteration: false
    resolve_dynamic_values_in_prompt: true
    result_as_human_message: false
  - id: requirements
    assistant_id: requirements_assistant
    next:
      state_id: planning
    task: Convert {{enhancements}} into clear requirements and acceptance criteria. Pause for human review before downstream implementation work proceeds.
    output_schema: "{requirements}"
    interrupt_before: true
    finish_iteration: false
    resolve_dynamic_values_in_prompt: true
    result_as_human_message: false
  - id: planning
    assistant_id: planning_assistant
    next:
      state_id: design
    task: Prepare an implementation plan for {{requirements}}, including affected files, sequencing, validation strategy, and risks.
    output_schema: "{plan}"
    interrupt_before: false
    finish_iteration: false
    resolve_dynamic_values_in_prompt: true
    result_as_human_message: false
  - id: design
    assistant_id: design_assistant
    next:
      state_id: development
    task: Create the technical design for {{plan}}, covering backend, UI, data, integration, and test considerations for Spring PetClinic.
    output_schema: "{design}"
    interrupt_before: true
    finish_iteration: false
    resolve_dynamic_values_in_prompt: true
    result_as_human_message: false
  - id: development
    assistant_id: development_assistant
    next:
      state_id: code_review
    task: Implement the approved {{design}} in the repository. Keep changes focused and include relevant validation steps.
    output_schema: "{development}"
    interrupt_before: true
    finish_iteration: false
    resolve_dynamic_values_in_prompt: true
    result_as_human_message: false
  - id: code_review
    assistant_id: code_review_assistant
    next:
      state_id: testing
    task: Review {{development}} against {{requirements}} and {{design}}. Report defects, risks, and required fixes before testing.
    output_schema: "{code_review}"
    interrupt_before: true
    finish_iteration: false
    resolve_dynamic_values_in_prompt: true
    result_as_human_message: false
  - id: testing
    assistant_id: testing_assistant
    next:
      state_id: deployment
    task: Prepare and execute tests for {{requirements}} using {{development}} and {{code_review}} as context. Include test results and unresolved gaps.
    output_schema: "{test_results}"
    interrupt_before: true
    finish_iteration: false
    resolve_dynamic_values_in_prompt: true
    result_as_human_message: false
  - id: deployment
    assistant_id: deployment_assistant
    next:
      state_id: documentation
    task: Deploy or run the Pet Clinic application locally using {{development}} and {{test_results}}. Check application health and report the run status.
    output_schema: "{deployment}"
    interrupt_before: true
    finish_iteration: false
    resolve_dynamic_values_in_prompt: true
    result_as_human_message: false
  - id: documentation
    assistant_id: documentation_assistant
    next:
      state_id: end
    task: Update or propose documentation based on {{requirements}}, {{plan}}, {{design}}, {{development}}, {{test_results}}, and {{deployment}}.
    output_schema: "{documentation}"
    interrupt_before: true
    finish_iteration: false
    resolve_dynamic_values_in_prompt: true
    result_as_human_message: false

