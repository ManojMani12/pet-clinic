<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

<h2 th:text="#{findOwners}">Find Owners</h2>

<form th:object="${owner}" th:action="@{/owners}" method="get" class="form-horizontal" id="search-owner-form">

    <div class="form-group">
        <div class="control-group" id="lastNameGroup">
            <label class="col-sm-2 control-label" th:text="#{lastName}">Last name </label>
            <div class="col-sm-10">
                <input class="form-control" th:field="*{lastName}" size="30" maxlength="80"/>
                <span class="help-inline" th:errors="*{lastName}">[error]</span>
            </div>
        </div>
    </div>

    <div class="form-group">
        <div class="control-group" id="cityGroup">
            <label class="col-sm-2 control-label" th:text="#{city}">City </label>
            <div class="col-sm-10">
                <input class="form-control" th:field="*{city}" size="30" maxlength="80"/>
                <span class="help-inline" th:errors="*{city}">[error]</span>
            </div>
        </div>
    </div>

    <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
            <button class="btn btn-default" type="submit" th:text="#{findOwner}">Find Owner</button>
        </div>
    </div>

</form>

<br/>
<a th:href="@{/owners/new}" class="btn btn-default">Add Owner</a>

</body>

</html>
