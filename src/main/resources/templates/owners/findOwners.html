<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>

  <h2 th:text="#{owners.find.heading}">Find Owners</h2>

  <form th:object="${owner}" th:action="@{/owners}" method="get" class="form-horizontal" id="search-owner-form">
    <div class="form-group">
      <label class="col-sm-2 control-label" th:text="#{owner.lastName}">Last name</label>
      <div class="col-sm-10">
        <input class="form-control" th:field="*{lastName}" size="30" maxlength="80"/>
        <span class="help-inline" th:errors="*{lastName}">[error]</span>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label" th:text="#{owner.city}">City</label>
      <div class="col-sm-10">
        <input class="form-control" name="city" size="30" maxlength="80" th:value="${city != null ? city : param.city}"/>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-default" th:text="#{owners.find.submit}">Find Owner</button>
      </div>
    </div>
  </form>

</body>
</html>
