<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>Find Owners</h2>

  <form th:object="${owner}" th:action="@{/owners}" method="get" class="form-horizontal" id="search-owner-form">

    <div class="form-group">
      <label class="col-sm-2 control-label">Last name </label>
      <div class="col-sm-10">
        <input class="form-control" th:field="*{lastName}" size="30" maxlength="80" />
        <span class="help-inline"><div th:each="err : ${#fields.allErrors()}" th:text="${err}" /></div></span>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">City </label>
      <div class="col-sm-10">
        <input class="form-control" th:field="*{city}" size="30" maxlength="80" />
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-default">Find Owner</button>
      </div>
    </div>

  </form>

  <br />
  <a th:href="@{/owners/new}" class="btn btn-default">Add Owner</a>

</body>

</html>
