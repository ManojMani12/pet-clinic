<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
	<meta charset="UTF-8" />
	<title>Find Owners</title>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<h2>Find Owners</h2>

<form th:object="${owner}" th:action="@{/owners}" method="get" class="form-horizontal" id="search-owner-form">
	<div class="form-group">
		<div class="control-group" id="lastName-group">
			<label class="col-sm-2 control-label">Last name </label>
			<div class="col-sm-10">
				<input class="form-control" th:field="*{lastName}" size="30" maxlength="80" />
				<span class="help-inline" th:errors="*{lastName}">[error]</span>
			</div>
		</div>
		<div class="control-group" id="city-group">
			<label class="col-sm-2 control-label">City </label>
			<div class="col-sm-10">
				<input class="form-control" th:field="*{city}" size="30" maxlength="80" />
			</div>
		</div>
	</div>
	<div class="form-group">
		<div class="col-sm-offset-2 col-sm-10">
			<button class="btn btn-default" type="submit">Find Owner</button>
		</div>
	</div>
</form>

<br/>
<a th:href="@{/owners/new}" class="btn btn-default">Add Owner</a>

</body>
</html>
