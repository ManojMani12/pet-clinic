<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

<h2>Owners</h2>

<table id="owners" class="table table-striped">
    <thead>
    <tr>
        <th style="width: 150px;">Name</th>
        <th style="width: 200px;">Address</th>
        <th>City</th>
        <th>Telephone</th>
        <th>Pets</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="owner : ${listOwners}">
        <td>
            <a th:href="@{'/owners/' + ${owner.id}}" th:text="${owner.firstName + ' ' + owner.lastName}"/></a>
        </td>
        <td th:text="${owner.address}" />
        <td th:text="${owner.city}" />
        <td th:text="${owner.telephone}" />
        <td>
            <span th:each="pet : ${owner.pets}" th:text="${pet.name + ' '}"/>
        </td>
    </tr>

    </tbody>
</table>

<div th:if="${totalPages > 1}" class="pagination">
    <span>Pages:</span>
    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
        <a th:if="${currentPage != i}"
           th:href="@{'/owners?page=' + ${i}
              + (${currentLastName != null} ? '&lastName=' + ${currentLastName} : '')
              + (${currentCity != null} ? '&city=' + ${currentCity} : '')}"
           th:text="${i}">page number</a>
        <span th:unless="${currentPage != i}" th:text="${i}"></span>
    </span>
    <span>
        <a th:if="${currentPage > 1}"
           th:href="@{'/owners?page=1'
              + (${currentLastName != null} ? '&lastName=' + ${currentLastName} : '')
              + (${currentCity != null} ? '&city=' + ${currentCity} : '')}"
           title="First" class="fa fa-fast-backward"></a>
        <a th:if="${currentPage > 1}"
           th:href="@{'/owners?page=' + ${currentPage - 1}
              + (${currentLastName != null} ? '&lastName=' + ${currentLastName} : '')
              + (${currentCity != null} ? '&city=' + ${currentCity} : '')}"
           title="Previous" class="fa fa-step-backward"></a>
        <span th:text="${currentPage}"></span>
        <a th:if="${currentPage < totalPages}"
           th:href="@{'/owners?page=' + ${currentPage + 1}
              + (${currentLastName != null} ? '&lastName=' + ${currentLastName} : '')
              + (${currentCity != null} ? '&city=' + ${currentCity} : '')}"
           title="Next" class="fa fa-step-forward"></a>
        <a th:if="${currentPage < totalPages}"
           th:href="@{'/owners?page=' + ${totalPages}
              + (${currentLastName != null} ? '&lastName=' + ${currentLastName} : '')
              + (${currentCity != null} ? '&city=' + ${currentCity} : '')}"
           title="Last" class="fa fa-fast-forward"></a>
    </span>
</div>

</body>

</html>
