<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">

<body th:fragment="ownersList">
  <table id="owners" class="table table-striped">
    <thead>
    <tr>
      <th style="width: 150px;">Name</th>
      <th style="width: 200px;">Address</th>
      <th>City</th>
      <th>Telephone</th>
      <th>Pets</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="owner : ${listOwners}">
      <td>
        <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}"></a>
      </td>
      <td th:text="${owner.address}"></td>
      <td th:text="${owner.city}"></td>
      <td th:text="${owner.telephone}"></td>
      <td>
        <span th:each="pet : ${owner.pets}" th:text="${pet.name + ' '}" />
      </td>
    </tr>
    </tbody>
  </table>
  <div class="row">
    <div class="col-md-6">
      <span th:text="${currentPage}" /> / <span th:text="${totalPages}" />
    </div>
    <div class="col-md-6">
      <span th:if="${totalPages > 1}" th:each="i : ${#numbers.sequence(1, totalPages)}">
        <a th:href="@{/owners(page=${i}, lastName=${lastName}, city=${city})}" th:text="${i}" />
      </span>
    </div>
  </div>
</body>

</html>
