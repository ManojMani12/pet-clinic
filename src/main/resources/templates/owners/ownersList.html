<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

  <body>

    <h2 th:text="#{owners}">Owners</h2>

    <table id="owners" class="table table-striped">
      <thead>
      <tr>
        <th style="width: 150px;" th:text="#{name}">Name</th>
        <th style="width: 200px;" th:text="#{address}">Address</th>
        <th th:text="#{city}">City</th>
        <th th:text="#{telephone}">Telephone</th>
        <th th:text="#{pets}">Pets</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="owner : ${listOwners}">
        <td>
          <a th:href="@{/owners/{ownerId}(ownerId=${owner.id})}" th:text="${owner.firstName + ' ' + owner.lastName}"></a>
        </td>
        <td th:text="${owner.address}" />
        <td th:text="${owner.city}" />
        <td th:text="${owner.telephone}" />
        <td>
          <span th:each="pet : ${owner.pets}" th:text="${pet.name + ' '}" />
        </td>
      </tr>
      </tbody>
    </table>

    <div th:if="${totalPages > 1}" class="pagination">

      <span class="previous" th:classappend="${currentPage == 1} ? 'disabled'">
        <a th:if="${currentPage > 1}" th:href="@{/owners(page=1, lastName=${lastName})}" title="First">First</a>
        <span th:unless="${currentPage > 1}">First</span>
      </span>

      <span class="previous" th:classappend="${currentPage == 1} ? 'disabled'">
        <a th:if="${currentPage > 1}" th:href="@{/owners(page=${currentPage - 1}, lastName=${lastName})}" title="Prev">Prev</a>
        <span th:unless="${currentPage > 1}">Prev</span>
      </span>

      <span th:each="i: ${#numbers.sequence(1, totalPages)}">
        <a th:if="${i != currentPage}" th:href="@{/owners(page=${i}, lastName=${lastName})}" th:text="${i}"></a>
        <span th:unless="${i != currentPage}" th:text="${i}"></span>
      </span>

      <span class="next" th:classappend="${currentPage == totalPages} ? 'disabled'">
        <a th:if="${currentPage < totalPages}" th:href="@{/owners(page=${currentPage + 1}, lastName=${lastName})}" title="Next">Next</a>
        <span th:unless="${currentPage < totalPages}">Next</span>
      </span>

      <span class="next" th:classappend="${currentPage == totalPages} ? 'disabled'">
        <a th:if="${currentPage < totalPages}" th:href="@{/owners(page=${totalPages}, lastName=${lastName})}" title="Last">Last</a>
        <span th:unless="${currentPage < totalPages}">Last</span>
      </span>
    </div>

  </body>

</html>
