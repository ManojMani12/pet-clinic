<!DOCTYPE html>

<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}" xmlns:th="http://www.thymeleaf.org">

<body>

<h2>Owners</h2>

<table id="owners" class="table table-striped">
    <thead>
    <tr>
        <th style="width: 150px;">Name</th>
        <th style="width: 200px;">Address</th>
        <th>City</th>
        <th>Telephone</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="owner : ${listOwners}">
        <td th:text="${owner.firstName + ' ' + owner.lastName}"/></td>
        <td th:text="${owner.address}"/></td>
        <td th:text="${owner.city}"/></td>
        <td th:text="${owner.telephone}"/></td>
        <td>
            <a th:href="@{/owners/{ownerId}(ownerId=${owner.id})}" class="btn btn-default">View</a>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${totalPages > 1}">
    <span>Pages:</span>

    <span th:if="${currentPage > 1}">
        <a th:if="${#strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:href="@{/owners(page=1)}">First</a>
        <a th:if="${!#strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:href="@{/owners(page=1, lastName=${lastName})}">First</a>
        <a th:if="${#strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:href="@{/owners(page=1, city=${city})}">First</a>
        <a th:if="${!#strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:href="@{/owners(page=1, lastName=${lastName}, city=${city})}">First</a>

        <a th:if="${#strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:href="@{/owners(page=${currentPage - 1})}">Prev</a>
        <a th:if="${!#strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:href="@{/owners(page=${currentPage - 1}, lastName=${lastName})}">Prev</a>
        <a th:if="${#strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:href="@{/owners(page=${currentPage - 1}, city=${city})}">Prev</a>
        <a th:if="${!#strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:href="@{/owners(page=${currentPage - 1}, lastName=${lastName}, city=${city})}">Prev</a>
    </span>

    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
        <span th:if="${i == currentPage}" th:text="${i}"/>
        <a th:if="${i != currentPage and #strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:text="${i}" th:href="@{/owners(page=${i})}"/>
        <a th:if="${i != currentPage and !#strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:text="${i}" th:href="@{/owners(page=${i}, lastName=${lastName})}"/>
        <a th:if="${i != currentPage and #strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:text="${i}" th:href="@{/owners(page=${i}, city=${city})}"/>
        <a th:if="${i != currentPage and !#strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:text="${i}" th:href="@{/owners(page=${i}, lastName=${lastName}, city=${city})}"/>
    </span>

    <span th:if="${currentPage < totalPages}">
        <a th:if="${#strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:href="@{/owners(page=${currentPage + 1})}">Next</a>
        <a th:if="${!#strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:href="@{/owners(page=${currentPage + 1}, lastName=${lastName})}">Next</a>
        <a th:if="${#strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:href="@{/owners(page=${currentPage + 1}, city=${city})}">Next</a>
        <a th:if="${!#strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:href="@{/owners(page=${currentPage + 1}, lastName=${lastName}, city=${city})}">Next</a>

        <a th:if="${#strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:href="@{/owners(page=${totalPages})}">Last</a>
        <a th:if="${!#strings.isEmpty(lastName) and #strings.isEmpty(city)}" th:href="@{/owners(page=${totalPages}, lastName=${lastName})}">Last</a>
        <a th:if="${#strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:href="@{/owners(page=${totalPages}, city=${city})}">Last</a>
        <a th:if="${!#strings.isEmpty(lastName) and !#strings.isEmpty(city)}" th:href="@{/owners(page=${totalPages}, lastName=${lastName}, city=${city})}">Last</a>
    </span>
</div>

</body>

</html>
