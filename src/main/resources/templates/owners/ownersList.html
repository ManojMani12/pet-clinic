<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>

  <h2 th:text="#{owners.list.heading}">Owners</h2>

  <div th:if="${(!#strings.isEmpty(lastName) || !#strings.isEmpty(city))}" class="owners-search-context">
    <p>
      <span th:text="#{owners.search.context.prefix}">Results for</span>
      <span th:if="${!#strings.isEmpty(lastName)}">
        <span th:text="#{owners.search.context.lastName}">last name starts with</span>:
        <strong th:text="${lastName}">Franklin</strong>
      </span>
      <span th:if="${!#strings.isEmpty(city)}">
        <span th:if="${!#strings.isEmpty(lastName)}">&nbsp;(&nbsp;</span>
        <span th:text="#{owners.search.context.city}">City</span>:
        <strong th:text="${city}">Madison</strong>
        <span th:if="${!#strings.isEmpty(lastName)}">&nbsp;)&nbsp;</span>
      </span>
    </p>
    <p>
      <a class="btn btn-default" th:href="@{/owners/find(lastName=${lastName}, city=${city})}" th:text="#{owners.search.backToSearch}">
        Back to Search
      </a>
      <a class="btn btn-default" th:href="@{/owners(page=1)}" th:text="#{owners.search.clearFilter}">
        Clear Filter
      </a>
    </p>
  </div>

  <table id="owners" class="table table-striped">
    <thead>
      <tr>
        <th style="width: 150px;" th:text="#{owner.name}">Name</th>
        <th style="width: 200px;" th:text="#{owner.address}">Address</th>
        <th th:text="#{owner.city}">City</th>
        <th style="width: 120px" th:text="#{owner.telephone}">Telephone</th>
        <th style="width: 120px" th:text="#{owner.pets}">Pets</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="owner : ${listOwners}">
        <td>
          <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}" />
        </td>
        <td th:text="${owner.address}" />
        <td th:text="${owner.city}" />
        <td th:text="${owner.telephone}" />
        <td>
          <span th:each="pet : ${owner.pets}" th:text="${pet.name}" th:remove="tag">
            Rob
          </span>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="row">
    <div class="col-sm-6">
      <div th:if="${totalPages > 0}">
        <ul class="pagination">
          <li th:classappend="${currentPage == 1} ? 'disabled'">
            <a th:href="@{/owners(page=${currentPage - 1}, lastName=${lastName}, city=${city}, size=${size})}">&laquo;</a>
          </li>

          <li th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
            <a th:href="@{/owners(page=${i}, lastName=${lastName}, city=${city}, size=${size})}" th:text="${i}">1</a>
          </li>

          <li th:classappend="${currentPage == totalPages} ? 'disabled'">
            <a th:href="@{/owners(page=${currentPage + 1}, lastName=${lastName}, city=${city}, size=${size})}">&raquo;</a>
          </li>
        </ul>
      </div>
    </div>
  </div>

</body>
</html>
