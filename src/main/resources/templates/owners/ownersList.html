<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
	<meta charset="UTF-8"/>
	<title>Owners List</title>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<h2>Owners</h2>

<table id="owners" class="table table-striped">
	<thead>
	<tr>
		<th style="width: 150px;">Name</th>
		<th style="width: 200px;">Address</th>
		<th>City</th>
		<th>Telephone</th>
		<th>Pets</th>
	</tr>
	</thead>
	<tbody>
	<tr th:each="owner : ${listOwners}">
		<td>
			<a th:href="@{/owners/{ownerId}(ownerId=${owner.id})}" th:text="${owner.firstName + ' ' + owner.lastName}"></a>
		</td>
		<td th:text="${owner.address}"></td>
		<td th:text="${owner.city}"></td>
		<td th:text="${owner.telephone}"></td>
		<td>
			<span th:each="pet : ${owner.pets}" th:text="${pet.name + ' '}"/>
		</td>
	</tr>
	</tbody>
</table>

<div th:if="${totalPages > 1}" class="pagination">
	<div class="row">
		<div class="col-md-6">
			<span th:text="'Showing page ' + ${currentPage} + ' of ' + ${totalPages}"></span>
		</div>
		<div class="col-md-6">
			<ul class="pagination">
				<li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
					<a class="page-link"
					   th:with="pageUrl=${(#strings.isEmpty(searchLastName) and #strings.isEmpty(searchCity))
							? '/owners?page=1'
							: (#strings.isEmpty(searchCity)
								? '/owners?page=1&lastName=' + searchLastName
								: '/owners?page=1&lastName=' + searchLastName + '&city=' + searchCity)}"
					   th:href="@{${pageUrl}}">First</a>
				</li>
				<li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
					<a class="page-link"
					   th:with="pageUrl=${(#strings.isEmpty(searchLastName) and #strings.isEmpty(searchCity))
							? '/owners?page=' + (${currentPage} - 1)
							: (#strings.isEmpty(searchCity)
								? '/owners?page=' + (${currentPage} - 1) + '&lastName=' + searchLastName
								: '/owners?page=' + (${currentPage} - 1) + '&lastName=' + searchLastName + '&city=' + searchCity)}"
					   th:href="@{${pageUrl}}">Previous</a>
				</li>
				<li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
					th:classappend="${currentPage == i} ? 'active'">
					<a class="page-link"
					   th:with="pageUrl=${(#strings.isEmpty(searchLastName) and #strings.isEmpty(searchCity))
							? '/owners?page=' + ${i}
							: (#strings.isEmpty(searchCity)
								? '/owners?page=' + ${i} + '&lastName=' + searchLastName
								: '/owners?page=' + ${i} + '&lastName=' + searchLastName + '&city=' + searchCity)}"
					   th:href="@{${pageUrl}}" th:text="${i}"></a>
				</li>
				<li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
					<a class="page-link"
					   th:with="pageUrl=${(#strings.isEmpty(searchLastName) and #strings.isEmpty(searchCity))
							? '/owners?page=' + (${currentPage} + 1)
							: (#strings.isEmpty(searchCity)
								? '/owners?page=' + (${currentPage} + 1) + '&lastName=' + searchLastName
								: '/owners?page=' + (${currentPage} + 1) + '&lastName=' + searchLastName + '&city=' + searchCity)}"
					   th:href="@{${pageUrl}}">Next</a>
				</li>
				<li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
					<a class="page-link"
					   th:with="pageUrl=${(#strings.isEmpty(searchLastName) and #strings.isEmpty(searchCity))
							? '/owners?page=' + ${totalPages}
							: (#strings.isEmpty(searchCity)
								? '/owners?page=' + ${totalPages} + '&lastName=' + searchLastName
								: '/owners?page=' + ${totalPages} + '&lastName=' + searchLastName + '&city=' + searchCity)}"
					   th:href="@{${pageUrl}}">Last</a>
				</li>
			</ul>
		</div>
	</div>
</div>

</body>
</html>
