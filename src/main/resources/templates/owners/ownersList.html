<!DOCTYPE html>

<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}" xmlns:th="http://www.thymeleaf.org">

<body>
  <h2>Owners</h2>

  <table id="owners" class="table table-striped">
    <thead>
    <tr>
      <th style="width: 150px;">Name</th>
      <th style="width: 200px;">Address</th>
      <th>City</th>
      <th>Telephone</th>
      <th>Pets</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="owner : ${listOwners}">
      <td>
        <a th:href="@{/owners/{ownerId}(ownerId=${owner.id})}" th:text="${owner.firstName + ' ' + owner.lastName}"/></a>
      </td>
      <td th:text="${owner.address}"/>
      <td th:text="${owner.city}"/>
      <td th:text="${owner.telephone}"/>
      <td>
        <span th:each="pet : ${owner.pets}" th:text="${pet.name + ' '}" />
      </td>
    </tr>
    </tbody>
  </table>

  <div th:if="${totalPages > 1}" class="text-center">
    <div class="pagination">
      <span>Pages:</span>
      <span th:if="${currentPage > 1}">
        <a th:href="@{/owners(page=1,lastName=${lastName})}" th:text="'<<'"/>
        <a th:href="@{/owners(page=${currentPage - 1},lastName=${lastName})}" th:text="'<'"/>
      </span>
      <span th:each="i : ${#numbers.sequence(1, totalPages)}">
        <a th:if="${currentPage != i}" th:href="@{/owners(page=${i},lastName=${lastName})}" th:text="${i}"/>
        <span th:unless="${currentPage != i}" th:text="${i}" class="current"/>
      </span>
      <span th:if="${currentPage < totalPages}">
        <a th:href="@{/owners(page=${currentPage + 1},lastName=${lastName})}" th:text="'>'"/>
        <a th:href="@{/owners(page=${totalPages},lastName=${lastName})}" th:text="'>>'"/>
      </span>
    </div>
  </div>
</body>
</html>
